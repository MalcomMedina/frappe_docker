# Configuración de Nginx para ERPNext con Traefik
# Guardar en: /etc/nginx/sites-available/erpnext
# Luego crear symlink: sudo ln -s /etc/nginx/sites-available/erpnext /etc/nginx/sites-enabled/
# Traefik corre en puertos internos 9080 (HTTP) y 9443 (HTTPS)

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name erp.auditoriasmac.com erp.mindsetgx.com;
    
    # Para Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuración HTTPS - Proxy a Traefik
server {
    listen 443 ssl http2;
    server_name erp.auditoriasmac.com erp.mindsetgx.com;

    # Certificados SSL (generar con certbot)
    ssl_certificate /etc/letsencrypt/live/erp.auditoriasmac.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.auditoriasmac.com/privkey.pem;
    
    # Si usas certificado wildcard o múltiples certificados:
    # ssl_certificate /etc/letsencrypt/live/erp.mindsetgx.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/erp.mindsetgx.com/privkey.pem;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Tamaño máximo de upload
    client_max_body_size 50m;

    # Proxy a Traefik (puerto 9080 HTTP - nginx maneja SSL)
    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # Le dice a Traefik que el cliente usó HTTPS
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (para Socket.IO)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

